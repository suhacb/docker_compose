networks:
    princess:

volumes:
    db:
    zincdb:
    qdrantdb:
    garagedb:
    onlyofficedb:

services:
    app:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: ${APP_NAME}_app
        ports:
            - "${APP_PORT}:80"
        volumes:
            - "${CODE_DIR}:${APP_DIR}"
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            php:
                condition: service_started
            db:
                condition: service_healthy
        networks:
            - ${NETWORK}

    db:
        image: postgres:17
        container_name: ${APP_NAME}_db
        restart: no
        environment:
            POSTGRES_DB: '${POSTGRES_DB}'
            POSTGRES_USER: '${POSTGRES_USER}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
            POSTGRES_TEST_DB: '${POSTGRES_TEST_DB}'
            POSTGRES_E2E_DB: '${POSTGRES_E2E_DB}'
            TZ: UTC
            PGTZ: UTC
        volumes:
            - db:/var/lib/postgresql/data
            - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
        networks:
            - ${NETWORK}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: ${APP_NAME}_pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: '${PGADMIN_DEFAULT_EMAIL}'
            PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_DEFAULT_PASSWORD}'
        ports:
            - "${PGADMIN_PORT}:80"
        networks:
            - ${NETWORK}

    php:
        build:
            context: ./php
            dockerfile: Dockerfile
            args:
                - workdir=${APP_DIR}
        container_name: ${APP_NAME}_php
        environment:
            - E2E_TOKEN=${E2E_TOKEN}
        volumes:
            - ${CODE_DIR}:${APP_DIR}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - ${NETWORK}

    artisan:
        build:
            context: ./php
            dockerfile: Dockerfile
            args:
                - workdir=${APP_DIR}
        container_name: ${APP_NAME}_artisan
        environment:
            - E2E_TOKEN=${E2E_TOKEN}
        volumes:
            - ${CODE_DIR}:${APP_DIR}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        working_dir: ${APP_DIR}
        entrypoint: ['php', '${APP_DIR}/artisan']
        networks:
            - ${NETWORK}

    redis:
        image: redis:7-alpine
        container_name: ${APP_NAME}_redis
        restart: no
        ports:
            - "${REDIS_PORT}:6379"
        networks:
            - ${NETWORK}
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    zincdb:
        image: public.ecr.aws/zinclabs/zincsearch:latest
        container_name: ${APP_NAME}_zincdb
        restart: no
        environment:
            ZINC_DATA_PATH: ${ZINC_DATA_PATH}
            ZINC_FIRST_ADMIN_USER: ${ZINC_FIRST_ADMIN_USER}
            ZINC_FIRST_ADMIN_PASSWORD: ${ZINC_FIRST_ADMIN_PASSWORD}
        ports:
            - "${ZINC_PORT}:4080"
        volumes:
            - zincdb:${ZINC_DATA_PATH}
        networks:
            - ${NETWORK}
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:4080/healthz | grep -q ok || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5

    qdrant:
        image: qdrant/qdrant:latest
        container_name: ${APP_NAME}_qdrant
        restart: no
        ports:
            - "${QDRANT_HTTP_PORT}:6333"
        volumes:
            - qdrantdb:/qdrant/storage
        networks:
            - ${NETWORK}
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz | grep -q ok || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5

    garage:
        image: dxflrs/garage:v1.3.1
        container_name: ${APP_NAME}_garage
        restart: no
        environment:
            GARAGE_RPC_SECRET: '${GARAGE_RPC_SECRET}'
            GARAGE_REGION: '${GARAGE_REGION}'
        ports:
            - "${GARAGE_S3_PORT}:3900"
            - "${GARAGE_ADMIN_PORT}:3903"
        volumes:
            - garagedb:/var/lib/garage
            - ./garage/garage.toml:/etc/garage.toml
        networks:
            - ${NETWORK}
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3903/health | grep -q ok || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 5

    onlyoffice:
        image: onlyoffice/documentserver:latest
        container_name: ${APP_NAME}_onlyoffice
        restart: no
        environment:
            JWT_ENABLED: 'true'
            JWT_SECRET: '${ONLYOFFICE_JWT_SECRET}'
            JWT_HEADER: 'Authorization'
        ports:
            - "${ONLYOFFICE_PORT}:80"
        volumes:
            - onlyofficedb:/var/www/onlyoffice/Data
        networks:
            - ${NETWORK}
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost/healthcheck | grep -q true || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 5
