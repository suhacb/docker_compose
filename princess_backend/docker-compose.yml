networks:
    princess:

volumes:
    db:
    zincdb:
    qdrantdb:

services:
    app:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: ${APP_NAME}_app
        ports:
            - "${APP_PORT}:80"
        volumes:
            - "${CODE_DIR}:${APP_DIR}"
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - db
        networks:
            - ${NETWORK}

    db:
        image: postgres:17
        container_name: ${APP_NAME}_db
        restart: no
        environment:
            POSTGRES_DB: '${POSTGRES_DB}'
            POSTGRES_USER: '${POSTGRES_USER}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
            TZ: UTC
            PGTZ: UTC
        volumes:
            - db:/var/lib/postgresql/data
            - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
        networks:
            - ${NETWORK}

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: ${APP_NAME}_pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: '${PGADMIN_DEFAULT_EMAIL}'
            PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_DEFAULT_PASSWORD}'
        ports:
            - "${PGADMIN_PORT}:80"
        networks:
            - ${NETWORK}

    php:
        build:
            context: ./php
            dockerfile: Dockerfile
            args:
                - workdir=${APP_DIR}
        container_name: ${APP_NAME}_php
        environment:
            - E2E_TOKEN=${E2E_TOKEN}
        volumes:
            - ${CODE_DIR}:${APP_DIR}
        networks:
            - ${NETWORK}

    artisan:
        build:
            context: ./php
            dockerfile: Dockerfile
            args:
                - workdir=${APP_DIR}
        container_name: ${APP_NAME}_artisan
        environment:
            - E2E_TOKEN=${E2E_TOKEN}
        volumes:
            - ${CODE_DIR}:${APP_DIR}
        depends_on:
            - db
        working_dir: ${APP_DIR}
        entrypoint: ['php', '${APP_DIR}/artisan']
        networks:
            - ${NETWORK}

    zincdb:
        image: public.ecr.aws/zinclabs/zincsearch:latest
        container_name: ${APP_NAME}_zincdb
        environment:
            ZINC_DATA_PATH: ${ZINC_DATA_PATH}
            ZINC_FIRST_ADMIN_USER: ${ZINC_FIRST_ADMIN_USER}
            ZINC_FIRST_ADMIN_PASSWORD: ${ZINC_FIRST_ADMIN_PASSWORD}
        ports:
            - "${ZINC_PORT}:4080"
        volumes:
            - zincdb:${ZINC_DATA_PATH}
        networks:
            - ${NETWORK}

    qdrant:
        image: qdrant/qdrant:latest
        container_name: ${APP_NAME}_qdrant
        ports:
            - "${QDRANT_HTTP_PORT}:6333"
        volumes:
            - qdrantdb:/qdrant/storage
        networks:
            - ${NETWORK}
